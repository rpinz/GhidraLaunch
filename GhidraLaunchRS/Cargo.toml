[package]
name = "ghidra_launch"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# Named like the packaged executable so the PDB (GhidraLaunchRS.pdb) matches the name
# recorded in the executable's debug directory after it is copied to bin\<Configuration>.
[[bin]]
name = "GhidraLaunchRS"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]

[build-dependencies]
embed-resource = "3.0.11"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
