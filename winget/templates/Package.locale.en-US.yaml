ShortDescription: Native Windows launcher, Ghidra and Eclipse Temurin JDK installed together.
Description: |-
  Installs Ghidra under %LocalAppData%\Ghidra Launch\Ghidra, the Eclipse Temurin JDK it needs,
  and a native ({{Variant}}) launcher that replaces ghidraRun.bat. Ghidra and Temurin are downloaded
  during installation, so an internet connection is required. Temurin installs machine-wide and
  asks for administrator approval. The C and Rust launcher packages replace one another.
