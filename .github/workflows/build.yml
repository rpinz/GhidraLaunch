name: Build launchers and installers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launchers:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore pinned WiX v5 tooling
        shell: pwsh
        run: dotnet tool restore
      - name: Build and rebuild native executables
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Configuration ${{ matrix.configuration }}
          ./scripts/build.ps1 -Configuration ${{ matrix.configuration }} -Rebuild
          cargo fmt --manifest-path GhidraLaunchGhidraHelperRS/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path GhidraLaunchGhidraHelperRS/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path GhidraLaunchGhidraHelperRS/Cargo.toml --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise both launchers
        shell: pwsh
        run: ./tests/launchers.ps1 -Configuration ${{ matrix.configuration }}
      - name: Exercise both native extraction helpers
        shell: pwsh
        run: ./tests/ghidra-helper.ps1 -Configuration ${{ matrix.configuration }}
      - name: Exercise native filesystem edge cases
        shell: pwsh
        run: |
          $configuration = '${{ matrix.configuration }}'
          ./scripts/build.ps1 -Target Faults -Configuration $configuration
          $env:C_HELPER_EXE = (Resolve-Path "GhidraLaunchGhidraHelperC/x64/$configuration/bin/GhidraLaunchGhidraHelperC.exe").Path
          $env:C_HELPER_FAULT_EXE = (Resolve-Path "GhidraLaunchGhidraHelperC/x64/$configuration/bin/GhidraLaunchGhidraHelperCFaults.exe").Path
          $env:RUST_HELPER_EXE = (Resolve-Path "GhidraLaunchGhidraHelperRS/bin/$configuration/GhidraLaunchGhidraHelperRS.exe").Path
          $env:C_HELPER_PEER_EXE = $env:RUST_HELPER_EXE
          $env:RUST_HELPER_PEER_EXE = $env:C_HELPER_EXE
          $env:C_HELPER_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'c-helper-tests'
          $env:RUST_HELPER_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'rust-helper-tests'
          New-Item -ItemType Directory -Path $env:C_HELPER_TEST_ROOT, $env:RUST_HELPER_TEST_ROOT -Force | Out-Null
          python -m unittest discover -s tests -p 'test_*_helper.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and inspect both installer pairs using synthetic upstream packages
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'installer-fixture'
          ./tests/create-fixture.ps1 -Destination $fixture
          ./scripts/build.ps1 -Target Installer
          ./scripts/build.ps1 -Target Internal -PayloadRoot $fixture -VersionsFile "$fixture/Versions.wxi"
          ./scripts/build.ps1 -Target Setup -PayloadRoot $fixture -VersionsFile "$fixture/Versions.wxi"
          foreach ($variant in @('C', 'Rust')) {
            ./tests/installer.ps1 -MsiPath "GhidraLaunchInstaller/bin/Release/GhidraLaunchInstaller$variant.msi" -Variant $variant
            ./tests/bundle.ps1 -BundlePath "GhidraLaunchSetup/bin/Release/GhidraLaunchSetup$variant.exe" -Variant $variant
          }
      - name: Exercise same-version and newer-version bundle switching
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./tests/upgrades.ps1 -PayloadRoot (Join-Path $env:RUNNER_TEMP 'installer-fixture')
      - name: Retain installer failure diagnostics
        if: failure() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-logs
          path: ${{ runner.temp }}/upgrade-logs/
          if-no-files-found: warn

  release-contracts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Syft
        shell: pwsh
        run: ./scripts/install-syft.ps1
      - name: Check build, signing, SBOM and publication contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
