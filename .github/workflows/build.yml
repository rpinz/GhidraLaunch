name: Build launchers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launchers:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build C and Rust launchers
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          $solutionDir = (Get-Location).Path + '\'
          & $msbuild GhidraLaunchC/GhidraLaunchC.vcxproj /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$solutionDir /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild GhidraLaunchRS/GhidraLaunchRS.vcxproj /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$solutionDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild GhidraLaunchRS/GhidraLaunchRS.vcxproj /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:SolutionDir=$solutionDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $msbuild GhidraLaunchGhidraHelper/GhidraLaunchGhidraHelper.csproj /t:Build /p:Configuration=${{ matrix.configuration }} /restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise both launchers
        shell: pwsh
        run: ./tests/launchers.ps1 -Configuration ${{ matrix.configuration }}
      - name: Exercise the Ghidra extraction helper
        shell: pwsh
        run: ./tests/ghidra-helper.ps1 -Configuration ${{ matrix.configuration }}
      - name: Build and inspect MSI layout
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild GhidraLaunch.sln /t:GhidraLaunchInstaller /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/installer.ps1 -MsiPath GhidraLaunchInstaller/bin/Release/GhidraLaunchInstaller.msi
